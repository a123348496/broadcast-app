# 免费路线：云端 Mac 编译出【未签名 ipa】，之后在 Windows 上用 Sideloadly/AltStore
# 用自己的免费 Apple ID 签名安装（无需苹果开发者账号，无需 Mac）。
#
# 使用：把 ios-app 目录内容作为 GitHub 仓库根上传，仓库 Actions 页面手动 Run
# （或直接 push 触发），构建完成后到本次运行页面底部 Artifacts 下载 Broadcast-unsigned-ipa。

name: iOS Build (unsigned ipa, free)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Flatten swift files into Sources (web-upload friendly)
        run: |
          mkdir -p Sources
          mv -v *.swift Sources/ || true
          ls -R

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: .
        run: xcodegen generate

      - name: Archive without signing
        working-directory: .
        run: |
          xcodebuild \
            -project Broadcast.xcodeproj \
            -scheme Broadcast \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath Broadcast.xcarchive

      - name: Pack unsigned ipa
        working-directory: .
        run: |
          mkdir -p Payload
          cp -R Broadcast.xcarchive/Products/Applications/Broadcast.app Payload/
          zip -qry Broadcast-unsigned.ipa Payload
          ls -lh Broadcast-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Broadcast-unsigned-ipa
          path: Broadcast-unsigned.ipa
          retention-days: 30
